&lt;script&gt;(() =&gt; {

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      nextState,

          typeof value === &quot;function&quot; ||

    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(

    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {

      ...globalThis.openai,

    postToHost(&quot;height&quot;, {

  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);

        hostPort != null ||
        source !== parentWindow ||

      try {
        apply(addHostMessageListener, nextHostPort, [

&lt;script&gt;
(function () {
  const root = document.getElementById(&#x27;stage2-day1-exam&#x27;);
  const questions = [{&quot;id&quot;:1,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;A hospital has a stable, legally mandated rule that a patient with a particular laboratory value above a fixed threshold must receive an alert. Which approach is most appropriate for implementing the alert itself?&quot;,&quot;choices&quot;:[&quot;A regression model because the threshold is numerical&quot;,&quot;Supervised learning because historical patients are available&quot;,&quot;Reinforcement learning because the system takes an action&quot;,&quot;Unsupervised clustering because no target is required&quot;,&quot;A rule-based system because the decision boundary is explicitly specified&quot;],&quot;correct&quot;:4},{&quot;id&quot;:2,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;In a table used to predict apartment rent, each row represents one apartment. The columns are area, district, building age, and monthly rent. Which description is correct?&quot;,&quot;choices&quot;:[&quot;Each row is a sample, all four columns are features, and the target is stored elsewhere&quot;,&quot;District is the target because it is categorical&quot;,&quot;Each row is a sample, the first three named columns are features, and rent is the target&quot;,&quot;Each column is a sample, and each row is a feature&quot;,&quot;Monthly rent is a feature because it is numeric&quot;],&quot;correct&quot;:2},{&quot;id&quot;:3,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;An agent observes a warehouse position, chooses a movement, and receives a penalty for collisions and a reward for delivering an item. Which mapping is correct?&quot;,&quot;choices&quot;:[&quot;Position = action; movement = state; delivery = environment&quot;,&quot;Position = environment; movement = reward; delivery = target&quot;,&quot;Position = target; movement = feature; collision = optimizer&quot;,&quot;Position = parameter; movement = hyperparameter; reward = loss function&quot;,&quot;Position = state; movement = action; delivery reward = reward signal&quot;],&quot;correct&quot;:4},{&quot;id&quot;:4,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;A company has customer behavior data but no churn labels. It wants to identify naturally occurring customer groups. Which method best matches the objective?&quot;,&quot;choices&quot;:[&quot;Clustering&quot;,&quot;Regression&quot;,&quot;Principal component analysis because every segmentation task is dimensionality reduction&quot;,&quot;Reinforcement learning&quot;,&quot;Classification&quot;],&quot;correct&quot;:0},{&quot;id&quot;:5,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;Which pair contains one learned parameter followed by one hyperparameter?&quot;,&quot;choices&quot;:[&quot;A fitted linear-regression coefficient; the regularization strength chosen before fitting&quot;,&quot;Validation accuracy; a predicted probability&quot;,&quot;A fitted coefficient followed by a fitted intercept&quot;,&quot;A training label; a test feature&quot;,&quot;The number of observations; a fitted intercept&quot;],&quot;correct&quot;:0},{&quot;id&quot;:6,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;During a forward pass, a neural network primarily:&quot;,&quot;choices&quot;:[&quot;Calculates only evaluation metrics, not predictions&quot;,&quot;Updates its parameters using gradients&quot;,&quot;Computes gradients and immediately modifies parameters&quot;,&quot;Divides the dataset into folds&quot;,&quot;Computes outputs and loss using the current parameter values&quot;],&quot;correct&quot;:4},{&quot;id&quot;:7,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;The backward pass is responsible for:&quot;,&quot;choices&quot;:[&quot;Computing how the loss changes with respect to model parameters&quot;,&quot;Converting probabilities into class labels&quot;,&quot;Updates parameters without calculating gradients&quot;,&quot;Replacing missing values&quot;,&quot;Selecting the train-test split&quot;],&quot;correct&quot;:0},{&quot;id&quot;:8,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;Which statement most precisely describes an optimizer?&quot;,&quot;choices&quot;:[&quot;It defines whether a task is regression or classification&quot;,&quot;It creates features from raw data&quot;,&quot;It uses gradient information to determine parameter updates&quot;,&quot;Calculates the gradients but never changes parameters&quot;,&quot;It calculates the validation metric but does not affect training&quot;],&quot;correct&quot;:2},{&quot;id&quot;:9,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;A classifier is trained by minimizing cross-entropy but judged using recall because missed positive cases are expensive. Which conclusion is correct?&quot;,&quot;choices&quot;:[&quot;The metric guides gradient updates while the loss expresses business priorities&quot;,&quot;The workflow is invalid because loss and metric must be identical&quot;,&quot;Recall must be differentiable for this workflow to be valid&quot;,&quot;Cross-entropy controls preprocessing, while recall controls splitting&quot;,&quot;The loss guides parameter learning, while recall expresses the evaluation priority&quot;],&quot;correct&quot;:4},{&quot;id&quot;:10,&quot;section&quot;:&quot;Learning framework&quot;,&quot;prompt&quot;:&quot;Which comparison between closed-form and iterative optimization is most accurate?&quot;,&quot;choices&quot;:[&quot;Iterative optimization requires no initialization or learning settings&quot;,&quot;Closed-form methods require a validation set; iterative methods do not&quot;,&quot;Closed-form methods never use data, while iterative methods do&quot;,&quot;Closed-form methods directly compute a solution when one is available; iterative methods progressively update parameters&quot;,&quot;Iterative methods always find th oximately 0.750&quot;,&quot;Approximately 0.979&quot;,&quot;Approximately 0.800&quot;],&quot;correct&quot;:1},{&quot;id&quot;:51,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;For a fixed probabilistic classifier, increasing the threshold required to predict the positive class will usually:&quot;,&quot;choices&quot;:[&quot;Increase false positives while decreasing true negatives&quot;,&quot;Decrease both precision and recall in every possible dataset&quot;,&quot;Increase both recall and the number of positive predictions&quot;,&quot;Leave the confusion matrix unchanged&quot;,&quot;Decrease recall and may increase precision&quot;],&quot;correct&quot;:4},{&quot;id&quot;:52,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;In a screening system where a missed disease case is far more costly than an unnecessary follow-up, which priority is most defensible?&quot;,&quot;choices&quot;:[&quot;Maximize the decision threshold&quot;,&quot;Use accuracy alone&quot;,&quot;Maximize specificity regardless of recall&quot;,&quot;Maximize F1 because it always represents medical cost&quot;,&quot;Emphasize recall while monitoring the resulting false-positive burden&quot;],&quot;correct&quot;:4},{&quot;id&quot;:53,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;An email provider wants to avoid placing legitimate emails in spam. Which positive-class metric deserves special attention if “spam” is the positive class?&quot;,&quot;choices&quot;:[&quot;Specificity, because it ignores true negatives&quot;,&quot;RMSE, because probabilities are continuous&quot;,&quot;Precision, because false-positive spam predictions should be limited&quot;,&quot;Recall, because every legitimate message is a false negative&quot;,&quot;Recall, because false negatives are legitimate emails&quot;],&quot;correct&quot;:2},{&quot;id&quot;:54,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;A regression dataset contains a few extremely large target errors that the business considers especially costly. Which metric penalizes those errors most strongly?&quot;,&quot;choices&quot;:[&quot;MSE&quot;,&quot;R-squared&quot;,&quot;Specificity&quot;,&quot;MAE&quot;,&quot;Classification accuracy&quot;],&quot;correct&quot;:0},{&quot;id&quot;:55,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;Why is RMSE often easier to interpret than MSE?&quot;,&quot;choices&quot;:[&quot;RMSE has the same units as the target variable&quot;,&quot;RMSE is unitless and therefore comparable across targets&quot;,&quot;RMSE ranges only from 0 to 1&quot;,&quot;RMSE is always smaller than MAE&quot;,&quot;RMSE ignores large errors&quot;],&quot;correct&quot;:0},{&quot;id&quot;:56,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;If prediction errors are measured in Saudi riyals, the units of MSE are:&quot;,&quot;choices&quot;:[&quot;Absolute riyals&quot;,&quot;Squared riyals&quot;,&quot;Percent&quot;,&quot;Riyals&quot;,&quot;No units&quot;],&quot;correct&quot;:1},{&quot;id&quot;:57,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;A regression model evaluated on a test set has R² = −0.4. Which interpretation is best?&quot;,&quot;choices&quot;:[&quot;The model performs worse under squared error than predicting the test-set target mean as a constant baseline&quot;,&quot;The model has explained negative variance in the target&quot;,&quot;The model explains 40% of the target variance&quot;,&quot;The model&#x27;s predictions are negatively correlated with every feature&quot;,&quot;R² cannot be negative, so the software is broken&quot;],&quot;correct&quot;:0},{&quot;id&quot;:58,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;Which condition yields R² = 1 on an evaluated dataset?&quot;,&quot;choices&quot;:[&quot;Predictions equal the observed targets for every evaluated sample&quot;,&quot;The mean residual is zero&quot;,&quot;The residuals sum to zero even if individual predictions are wrong&quot;,&quot;MAE and RMSE have equal values&quot;,&quot;The model predicts the target mean for every sample&quot;],&quot;correct&quot;:0},{&quot;id&quot;:59,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;For an extremely imbalanced dataset with rare positives, why is a precision-recall curve often more informative than a ROC curve?&quot;,&quot;choices&quot;:[&quot;ROC curves cannot be computed for binary classification&quot;,&quot;Precision-recall analysis focuses directly on positive predictions and recovered positives&quot;,&quot;ROC analysis considers only positive examples and ignores negatives&quot;,&quot;ROC-AUC always equals accuracy&quot;,&quot;Precision-recall curves do not depend on thresholds&quot;],&quot;correct&quot;:1},{&quot;id&quot;:60,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;A classifier ranks every positive example above every negative example, but the currently selected threshold produces poor recall. Which statement can still be true?&quot;,&quot;choices&quot;:[&quot;ROC-AUC must equal recall&quot;,&quot;ROC-AUC can be 1.0 despite poor performance at the selected threshold&quot;,&quot;Precision must be zero at every threshold&quot;,&quot;Precision-recall AUC must be zero whenever recall at one threshold is poor&quot;,&quot;The classifier cannot produce probabilities&quot;],&quot;correct&quot;:1},{&quot;id&quot;:61,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;In a three-class problem, one rare class performs very poorly while two common classes perform well. Which averaging method is most likely to expose the rare class problem?&quot;,&quot;choices&quot;:[&quot;Macro averaging&quot;,&quot;Weighted averaging&quot;,&quot;Micro averaging only&quot;,&quot;Weighted averaging, because weighting always emphasizes the rare class&quot;,&quot;Overall accuracy only&quot;],&quot;correct&quot;:0},{&quot;id&quot;:62,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;For ordinary single-label multiclass classification, micro-averaged recall is typically equal to:&quot;,&quot;choices&quot;:[&quot;R²&quot;,&quot;Overall accuracy&quot;,&quot;Macro-averaged precision&quot;,&quot;Macro recall&quot;,&quot;The recall of the rarest class&quot;],&quot;correct&quot;:1},{&quot;id&quot;:63,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;For residual defined as `actual − predicted`, an actual value of 120 and prediction of 135 produce:&quot;,&quot;choices&quot;:[&quot;Residual = 15, an underprediction&quot;,&quot;Residual = 15, an overprediction&quot;,&quot;Residual = −15, an underprediction&quot;,&quot;Residual = −15, an overprediction&quot;,&quot;Residual = 15, an overprediction&quot;],&quot;correct&quot;:3},{&quot;id&quot;:64,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;Which statement about metric selection is strongest?&quot;,&quot;choices&quot;:[&quot;The most commonly reported metric should be selected regardless of error cost&quot;,&quot;Accuracy should be used for every classification problem because it is intuitive&quot;,&quot;F1 is always superior to precision and recall&quot;,&quot;The preferred metric should reflect the relative costs of the errors and the class distribution&quot;,&quot;ROC-AUC determines the correct business threshold automatically&quot;],&quot;correct&quot;:3},{&quot;id&quot;:65,&quot;section&quot;:&quot;Metrics&quot;,&quot;prompt&quot;:&quot;Two fraud models have equal recall. Model A has precision 0.20, and Model B has precision 0.40. Which statement is correct?&quot;,&quot;choices&quot;:[&quot;Equal recall means precision differences cannot reveal anything about false alarms&quot;,&quot;Both models have identical confusion matrices&quot;,&quot;A necessarily has higher accuracy&quot;,&quot;B produces fewer false alarms per recovered fraud case&quot;,&quot;Precision cannot be compared when recall is equal&quot;],&quot;correct&quot;:3},{&quot;id&quot;:66,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;For a scikit-learn estimator, calling `fit(X_train, y_train)` primarily:&quot;,&quot;choices&quot;:[&quot;Creates predictions without storing any learned state&quot;,&quot;Guarantees calibrated probabilities&quot;,&quot;Produces final test predictions without learning&quot;,&quot;Learns estimator state or parameters from the training data&quot;,&quot;Splits the data into folds&quot;],&quot;correct&quot;:3},{&quot;id&quot;:67,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;For a fitted scaler, calling `transform(X_test)` should:&quot;,&quot;choices&quot;:[&quot;Fit the downstream classifier&quot;,&quot;Relearn scaling statistics from the test set while preserving training coefficients&quot;,&quot;Apply the statistics previously learned during `fit`&quot;,&quot;Recalculate scaling statistics from `X_test`&quot;,&quot;Convert regression targets into classes&quot;],&quot;correct&quot;:2},{&quot;id&quot;:68,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which sequence is correct?&quot;,&quot;choices&quot;:[&quot;`fit_transform(X_train)`, then `transform(X_test)`&quot;,&quot;`transform(X_train)`, then `fit(X_test)`&quot;,&quot;`fit_transform(X_train)`, then `fit_transform(X_test)`&quot;,&quot;Call fit_transform separately on training, validation, and test data&quot;,&quot;`predict(X_train)`, then `fit_transform(X_test)`&quot;],&quot;correct&quot;:0},{&quot;id&quot;:69,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which statement about `StandardScaler` is correct?&quot;,&quot;choices&quot;:[&quot;It uses the median and interquartile range&quot;,&quot;It normally centers using the fitted mean and scales using the fitted standard deviation&quot;,&quot;It maps every feature exactly into [0, 1]&quot;,&quot;It centers using the median and scales using the interquartile range&quot;,&quot;It removes all outliers&quot;],&quot;correct&quot;:1},{&quot;id&quot;:70,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Why can `MinMaxScaler` be strongly affected by an extreme outlier?&quot;,&quot;choices&quot;:[&quot;Its fitted minimum and maximum determine the scaling range for other values&quot;,&quot;Because it automatically deletes values outside the fitted range&quot;,&quot;It converts all values into categories&quot;,&quot;It ignores the training data distribution&quot;,&quot;It always uses the target variable&quot;],&quot;correct&quot;:0},{&quot;id&quot;:71,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which scaler is designed to be more resistant to extreme values by using robust statistics?&quot;,&quot;choices&quot;:[&quot;StandardScaler configured with a fixed random_state&quot;,&quot;`StandardScaler`&quot;,&quot;`MinMaxScaler`&quot;,&quot;`RobustScaler`&quot;,&quot;`OneHotEncoder`&quot;],&quot;correct&quot;:3},{&quot;id&quot;:72,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which variable is most appropriate for ordinal encoding?&quot;,&quot;choices&quot;:[&quot;Customer IDs&quot;,&quot;Random invoice codes&quot;,&quot;City names with no inherent order&quot;,&quot;Satisfaction levels: low, medium, high&quot;,&quot;Postal codes ordered numerically from smallest to largest&quot;],&quot;correct&quot;:3},{&quot;id&quot;:73,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Why is independently running one-hot encoding on training and test data dangerous?&quot;,&quot;choices&quot;:[&quot;Test data must never contain categorical values&quot;,&quot;It always causes high bias&quot;,&quot;The sets or orders of generated columns may differ&quot;,&quot;One-hot encoding works only on numerical columns&quot;,&quot;Independent encoding is safe; it only increases memory usage&quot;],&quot;correct&quot;:2},{&quot;id&quot;:74,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;A category appears in the test set but was absent from training. Which configuration most directly prevents `OneHotEncoder` from failing on that category?&quot;,&quot;choices&quot;:[&quot;`strategy=\&quot;median\&quot;`&quot;,&quot;`with_mean=False`&quot;,&quot;`handle_unknown=\&quot;ignore\&quot;`&quot;,&quot;`random_state=0`&quot;,&quot;sparse_output=False&quot;],&quot;correct&quot;:2},{&quot;id&quot;:75,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;A dataset contains numerical columns needing imputation and scaling, plus categorical columns needing imputation and one-hot encoding. Which tool coordinates different transformations for different columns?&quot;,&quot;choices&quot;:[&quot;`train_test_split`&quot;,&quot;`confusion_matrix`&quot;,&quot;`DummyClassifier`&quot;,&quot;`ColumnTransformer`&quot;,&quot;Pipeline, because it automatically assigns transformations to column subsets without configuration&quot;],&quot;correct&quot;:3},{&quot;id&quot;:76,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;What is the most important correctness benefit of placing preprocessing and a model in one `Pipeline`?&quot;,&quot;choices&quot;:[&quot;It helps apply the same ordered transformations and allows fold-specific preprocessing during cross-validation&quot;,&quot;It eliminates the need for a test set&quot;,&quot;It makes all features normally distributed&quot;,&quot;It guarantees the selected model is optimal&quot;,&quot;It improves execution speed but does not affect correctness&quot;],&quot;correct&quot;:0},{&quot;id&quot;:77,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which cross-validation call is safest when scaling is required?&quot;,&quot;choices&quot;:[&quot;Fit the scaler on the test set, then cross-validate the classifier&quot;,&quot;Pass a pipeline containing the scaler and classifier to `cross_val_score`&quot;,&quot;Use a different manually selected scaler for each validation result&quot;,&quot;Scale the complete dataset first, then cross-validate only the classifier&quot;,&quot;Fit one scaler on all data, transform it once, then pass only the classifier to cross_val_score&quot;],&quot;correct&quot;:1},{&quot;id&quot;:78,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;A `DummyClassifier` scores 91% accuracy, while a complex model scores 92% on a highly imbalanced task. What is the best conclusion?&quot;,&quot;choices&quot;:[&quot;The dummy model has learned nonlinear patterns&quot;,&quot;Accuracy shows only a small improvement over a weak baseline, so class-sensitive metrics and error costs must be examined&quot;,&quot;The complex model is clearly excellent&quot;,&quot;Baselines are irrelevant once a complex model is trained&quot;,&quot;A one-percentage-point improvement proves meaningful minority-class detection&quot;],&quot;correct&quot;:1},{&quot;id&quot;:79,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Setting `random_state=42` in every applicable component primarily supports:&quot;,&quot;choices&quot;:[&quot;Automatic elimination of bias&quot;,&quot;Reproducibility of randomized operations, not guaranteed model quality&quot;,&quot;Perfect test accuracy&quot;,&quot;Selection of 42 model parameters&quot;,&quot;Guaranteed optimal model quality for seed 42&quot;],&quot;correct&quot;:1},{&quot;id&quot;:80,&quot;section&quot;:&quot;Scikit-learn&quot;,&quot;prompt&quot;:&quot;Which workflow is the most defensible end-to-end procedure for a tabular classification problem?&quot;,&quot;choices&quot;:[&quot;Inspect all data, fit preprocessing on all data, split, tune on test, report the best test result&quot;,&quot;Separate an untouched test set, place learned preprocessing and the model in a pipeline, tune with cross-validation on training data, refit the selected pipeline on all training data, and evaluate once on test&quot;,&quot;Split data, independently preprocess each subset, repeatedly tune using test accuracy, and report training accuracy&quot;,&quot;Fit the model before preprocessing, use the validation set for parameter updates, and use the training set for final evaluation&quot;,&quot;Fit preprocessing on all available rows, then split and evaluate once&quot;],&quot;correct&quot;:1}];
  const letters = [&#x27;A&#x27;, &#x27;B&#x27;, &#x27;C&#x27;, &#x27;D&#x27;, &#x27;E&#x27;];
  const storageKey = &#x27;kaust-stage2-day1-exam-v1&#x27;;
  const defaultState = { answers: Array(80).fill(null), current: 0, submitted: false };
  let state = loadInitialState();
  let finishArmed = false;
  let resetArmed = false;

  const promptEl = root.querySelector(&#x27;#question-prompt&#x27;);
  const choicesEl = root.querySelector(&#x27;#question-choices&#x27;);
  const numberEl = root.querySelector(&#x27;#question-number&#x27;);
  const sectionEl = root.querySelector(&#x27;#question-section&#x27;);
  const selectEl = root.querySelector(&#x27;#question-select&#x27;);
  const feedbackEl = root.querySelector(&#x27;#answer-feedback&#x27;);
  const alertEl = root.querySelector(&#x27;#exam-alert&#x27;);
  const resultsEl = root.querySelector(&#x27;#exam-results&#x27;);

  for (let i = 0; i &lt; questions.length; i++) {
    const option = document.createElement(&#x27;option&#x27;);
    option.value = String(i);
    option.textContent = &#x27;Question &#x27; + (i + 1);
    selectEl.appendChild(option);
  }

  function normalizeState(candidate) {
    if (!candidate || !Array.isArray(candidate.answers) || candidate.answers.length !== 80) return { ...defaultState, answers: [...defaultState.answers] };
    return {
      answers: candidate.answers.map(v =&gt; Number.isInteger(v) &amp;&amp; v &gt;= 0 &amp;&amp; v &lt; 5 ? v : null),
      current: Number.isInteger(candidate.current) ? Math.max(0, Math.min(79, candidate.current)) : 0,
      submitted: Boolean(candidate.submitted)
    };
  }

  function loadInitialState() {
    const hostState = window.openai &amp;&amp; window.openai.widgetState;
    if (hostState &amp;&amp; hostState.privateContent) return normalizeState(hostState.privateContent);
    try {
      const saved = localStorage.getItem(storageKey);
      if (saved) return normalizeState(JSON.parse(saved));
    } catch (_) {}
    return { ...defaultState, answers: [...defaultState.answers] };
  }

  function persist() {
    const score = calculateScore();
    root.querySelector(&#x27;#save-status&#x27;).textContent = &#x27;Saving…&#x27;;
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {}
    if (window.openai &amp;&amp; window.openai.setWidgetState) {
      window.openai.setWidgetState({
        modelContent: state.submitted ? { score: score.correct, total: 80, percent: score.percent } : { answered: score.answered, total: 80 },
        privateContent: state
      }).then(() =&gt; {
        root.querySelector(&#x27;#save-status&#x27;).textContent = &#x27;Saved&#x27;;
      }).catch(() =&gt; {
        root.querySelector(&#x27;#save-status&#x27;).textContent = &#x27;Saved locally&#x27;;
      });
    } else {
      root.querySelector(&#x27;#save-status&#x27;).textContent = &#x27;Saved locally&#x27;;
    }
  }

  function calculateScore() {
    let correct = 0;
    let answered = 0;
    const sections = {};
    questions.forEach((q, i) =&gt; {
      if (!sections[q.section]) sections[q.section] = { correct: 0, total: 0 };
      sections[q.section].total++;
      if (state.answers[i] !== null) {
        answered++;
        if (state.answers[i] === q.correct) {
          correct++;
          sections[q.section].correct++;
        }
      }
    });
    return { correct, answered, unanswered: 80 - answered, percent: Math.round(correct / 80 * 100), sections };
  }

  function updateProgress() {
    const score = calculateScore();
    root.querySelector(&#x27;#answered-count&#x27;).textContent = score.answered;
    root.querySelector(&#x27;#remaining-count&#x27;).textContent = score.unanswered;
    const bar = root.querySelector(&#x27;#exam-progress&#x27;);
    bar.style.width = (score.answered / 80 * 100) + &#x27;%&#x27;;
    const progress = bar.parentElement;
    progress.setAttribute(&#x27;aria-valuenow&#x27;, String(score.answered));
    for (let i = 0; i &lt; selectEl.options.length; i++) {
      const mark = state.answers[i] === null ? &#x27;&#x27; : &#x27; ✓&#x27;;
      selectEl.options[i].textContent = &#x27;Question &#x27; + (i + 1) + mark;
    }
  }

  function renderQuestion() {
    const q = questions[state.current];
    numberEl.textContent = &#x27;Question &#x27; + (state.current + 1) + &#x27; of 80&#x27;;
    sectionEl.textContent = q.section;
    promptEl.textContent = q.prompt;
    selectEl.value = String(state.current);
    choicesEl.innerHTML = &#x27;&#x27;;
    q.choices.forEach((choice, idx) =&gt; {
      const label = document.createElement(&#x27;label&#x27;);
      label.className = &#x27;form-check&#x27;;
      const input = document.createElement(&#x27;input&#x27;);
      input.className = &#x27;form-check-input&#x27;;
      input.type = &#x27;radio&#x27;;
      input.name = &#x27;exam-answer&#x27;;
      input.value = String(idx);
      input.checked = state.answers[state.current] === idx;
      input.disabled = state.submitted;
      input.addEventListener(&#x27;change&#x27;, () =&gt; {
        state.answers[state.current] = idx;
        finishArmed = false;
        root.querySelector(&#x27;#finish-exam&#x27;).textContent = &#x27;Finish and calculate score&#x27;;
        alertEl.hidden = true;
        updateProgress();
        persist();
      });
      const text = document.createElement(&#x27;span&#x27;);
      text.className = &#x27;form-check-label&#x27;;
      const letter = document.createElement(&#x27;span&#x27;);
      letter.className = &#x27;choice-letter&#x27;;
      letter.textContent = letters[idx] + &#x27;.&#x27;;
      text.appendChild(letter);
      text.appendChild(document.createTextNode(choice));
      label.appendChild(input);
      label.appendChild(text);
      choicesEl.appendChild(label);
    });
    feedbackEl.hidden = !state.submitted;
    feedbackEl.className = &#x27;&#x27;;
    if (state.submitted) {
      const selected = state.answers[state.current];
      if (selected === q.correct) {
        feedbackEl.className = &#x27;feedback-correct&#x27;;
        feedbackEl.textContent = &#x27;Correct.&#x27;;
      } else {
        feedbackEl.className = &#x27;feedback-incorrect&#x27;;
        const selectedText = selected === null ? &#x27;No answer selected.&#x27; : &#x27;Your answer: &#x27; + letters[selected] + &#x27;.&#x27;;
        feedbackEl.textContent = selectedText + &#x27; Correct answer: &#x27; + letters[q.correct] + &#x27;. &#x27; + q.choices[q.correct];
      }
    }
    root.querySelector(&#x27;#previous-question&#x27;).disabled = state.current === 0;
    root.querySelector(&#x27;#next-question&#x27;).disabled = state.current === 79;
    root.querySelector(&#x27;#finish-exam&#x27;).hidden = state.submitted;
    updateProgress();
  }

  function renderResults() {
    if (!state.submitted) {
      resultsEl.hidden = true;
      return;
    }
    const score = calculateScore();
    resultsEl.hidden = false;
    root.querySelector(&#x27;#score-correct&#x27;).textContent = score.correct + &#x27; / 80&#x27;;
    root.querySelector(&#x27;#score-percent&#x27;).textContent = score.percent + &#x27;%&#x27;;
    root.querySelector(&#x27;#score-unanswered&#x27;).textContent = score.unanswered;
    const tbody = root.querySelector(&#x27;#section-results&#x27;);
    tbody.innerHTML = &#x27;&#x27;;
    Object.entries(score.sections).forEach(([name, values]) =&gt; {
      const tr = document.createElement(&#x27;tr&#x27;);
      const pct = Math.round(values.correct / values.total * 100);
      [name, String(values.correct), String(values.total), pct + &#x27;%&#x27;].forEach((value, idx) =&gt; {
        const cell = document.createElement(idx === 0 ? &#x27;th&#x27; : &#x27;td&#x27;);
        cell.textContent = value;
        if (idx &gt; 0) cell.className = &#x27;text-end&#x27;;
        tr.appendChild(cell);
      });
      tbody.appendChild(tr);
    });
  }

  function goTo(index) {
    state.current = Math.max(0, Math.min(79, index));
    alertEl.hidden = true;
    renderQuestion();
    persist();
  }

  root.querySelector(&#x27;#previous-question&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; goTo(state.current - 1));
  root.querySelector(&#x27;#next-question&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; goTo(state.current + 1));
  selectEl.addEventListener(&#x27;change&#x27;, () =&gt; goTo(Number(selectEl.value)));

  root.querySelector(&#x27;#finish-exam&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const score = calculateScore();
    if (score.unanswered &gt; 0 &amp;&amp; !finishArmed) {
      finishArmed = true;
      alertEl.textContent = score.unanswered + &#x27; questions are unanswered. Click the finish button again to submit them as incorrect.&#x27;;
      alertEl.hidden = false;
      root.querySelector(&#x27;#finish-exam&#x27;).textContent = &#x27;Finish with &#x27; + score.unanswered + &#x27; unanswered&#x27;;
      return;
    }
    finishArmed = false;
    state.submitted = true;
    renderQuestion();
    renderResults();
    persist();
    resultsEl.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
  });

  root.querySelector(&#x27;#review-first-mistake&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const idx = questions.findIndex((q, i) =&gt; state.answers[i] !== q.correct);
    if (idx &gt;= 0) goTo(idx);
  });

  root.querySelector(&#x27;#return-current&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    root.querySelector(&#x27;.exam-question&#x27;).scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
  });

  root.querySelector(&#x27;#exam-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (!resetArmed) {
      resetArmed = true;

      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
